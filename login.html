<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Meninos da Vila</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#122017] text-white flex items-center justify-center min-h-screen">

    <div class="bg-[#1a2e21] border border-[#2d4d38] p-8 rounded-2xl shadow-xl w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-emerald-400">MENINOS DA VILA</h1>
            <p class="text-xs text-gray-400 mt-1">Aceda à sua conta para gerenciar o clube</p>
        </div>

        <form id="form-login" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">E-mail</label>
                <input type="email" id="email" required 
                    class="w-full bg-[#122017] border border-[#2d4d38] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500"
                    placeholder="admin@meninosdavila.com">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-300 mb-1">Senha</label>
                <input type="password" id="senha" required 
                    class="w-full bg-[#122017] border border-[#2d4d38] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500"
                    placeholder="••••••••">
            </div>

            <button type="submit" 
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl transition duration-200 text-sm shadow-lg shadow-emerald-900/50">
                Entrar no Sistema
            </button>
        </form>
    </div>

    <script>
        const API_URL = 'https://meninos-da-vila-api.onrender.com';

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            try {
                const res = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('usuario', JSON.stringify(data.usuario));
                    window.location.href = 'index.html';
                } else {
                    alert(data.erro || 'E-mail ou senha incorretos.');
                }
            } catch (err) {
                console.error('Erro:', err);
                alert('Erro ao comunicar com o servidor. A API pode estar a reiniciar, aguarde alguns segundos e tente novamente.');
            }
        });
    </script>
</body>
</html>
