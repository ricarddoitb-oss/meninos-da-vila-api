<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Clube Meninos da Vila</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pitch: { 900: '#0b1410', 800: '#122017', 700: '#1e3828', gold: '#f59e0b' }
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 25px rgba(16, 185, 129, 0.15), inset 0 0 15px rgba(245, 158, 11, 0.05); }
            50% { box-shadow: 0 0 45px rgba(16, 185, 129, 0.3), inset 0 0 25px rgba(245, 158, 11, 0.1); }
        }
        .login-card {
            animation: pulse-glow 4s infinite ease-in-out;
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-pitch-900 text-white min-h-screen flex items-center justify-center relative overflow-hidden">

    <!-- Efeito de Fundo Decorativo -->
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-emerald-600/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Container Principal do Login -->
    <div class="login-card bg-pitch-800/90 border border-emerald-500/30 p-8 rounded-3xl w-full max-w-md shadow-2xl relative z-10 mx-4 transition-all duration-300">
        
        <!-- Logo do Clube e @ do Instagram -->
        <div class="text-center mb-6 relative">
            <div class="w-24 h-24 mx-auto mb-4 rounded-full overflow-hidden border-4 border-amber-400 shadow-xl bg-pitch-900 ring-4 ring-emerald-500/20 transform hover:scale-105 transition duration-300">
                <img id="login-logo" src="https://raw.githubusercontent.com/ricarddoitb-oss/meninos-da-vila-api/refs/heads/main/logo.png" alt="Logo Clube Meninos da Vila" class="w-full h-full object-cover">
            </div>
            <h1 class="text-2xl font-black text-amber-400 tracking-wider drop-shadow-md">MENINOS DA VILA</h1>
            <p class="text-xs text-emerald-400 font-semibold tracking-wider mt-1"><i class="fa-brands fa-instagram mr-1"></i>@cmvitb</p>
        </div>

        <!-- Formulário de Acesso -->
        <form onsubmit="realizarLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-1">E-mail de Acesso</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" id="email" required placeholder="seu.email@dominio.com" class="w-full bg-pitch-900/80 border border-pitch-700 rounded-xl py-3 pl-10 pr-4 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-1">Palavra-passe</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="senha" required placeholder="••••••••" class="w-full bg-pitch-900/80 border border-pitch-700 rounded-xl py-3 pl-10 pr-4 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition">
                </div>
            </div>

            <!-- Botão de Entrar -->
            <button type="submit" class="w-full mt-2 bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 text-gray-950 font-extrabold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-600/20 transform hover:-translate-y-0.5 active:translate-y-0 transition duration-200 flex items-center justify-center space-x-2">
                <span>Entrar no Sistema</span>
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>

        <!-- Rodapé do Card -->
        <div class="mt-8 pt-4 border-t border-pitch-700/60 text-center">
            <p class="text-[11px] text-gray-400">Painel Administrativo & Gestão</p>
        </div>
    </div>

    <!-- SCRIPT DE AUTENTICAÇÃO -->
    <script>
        const API_URL = 'https://meninos-da-vila-api.onrender.com';

        async function realizarLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            try {
                const res = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                const dados = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', dados.token);
                    localStorage.setItem('usuario', JSON.stringify(dados.usuario));
                    window.location.href = 'index.html';
                } else {
                    alert(dados.erro || 'Erro ao efetuar login. Verifique suas credenciais.');
                }
            } catch (err) {
                console.error(err);
                alert('Erro de conexão com o servidor. Tente novamente mais tarde.');
            }
        }
    </script>
</body>
</html>
